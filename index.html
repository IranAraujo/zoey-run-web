<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Zoey Run! — Web & Mobile</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #151324;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#151324">
<link rel="icon" type="image/png" href="icon.png">
<style>
/* Mobile Landscape & Portrait Warning Styles */
#orientation-overlay {
	display: none;
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: linear-gradient(135deg, #0d111d 0%, #171d2e 100%);
	z-index: 999999;
	color: white;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	text-align: center;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	padding: 24px;
	box-sizing: border-box;
}
@media screen and (orientation: portrait) and (max-width: 950px) {
	#orientation-overlay {
		display: flex !important;
	}
}
@keyframes phoneRotateAnim {
	0% { transform: rotate(0deg); }
	40% { transform: rotate(-90deg); }
	60% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}
.rotate-phone-icon {
	font-size: 72px;
	display: inline-block;
	animation: phoneRotateAnim 2.4s infinite ease-in-out;
	margin-bottom: 16px;
}
</style>

	</head>
	<body>

<div id="orientation-overlay">
	<div class="rotate-phone-icon">📱</div>
	<h2 style="color: #ff9e2c; font-size: 24px; margin: 0 0 10px 0; font-weight: 800; letter-spacing: 0.5px;">VIRE O CELULAR NA HORIZONTAL!</h2>
	<p style="color: #cbd5e1; font-size: 16px; max-width: 340px; margin: 0 0 16px 0; line-height: 1.45;">
		Para jogar <b>Zoey Run!</b> com a melhor visão dos obstáculos e botões grandes confortáveis, coloque seu aparelho em <b>Modo Paisagem</b>!
	</p>
	<div style="background: rgba(255,158,44,0.15); border: 1px solid #ff9e2c; border-radius: 12px; padding: 10px 18px; font-size: 14px; color: #fde047;">
		✨ Toque na tela para rodar em <b>Tela Cheia</b>!
	</div>
</div>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false" src="" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>

const isMobileDevice = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
	|| (('ontouchstart' in window) && Math.min(window.screen.width, window.screen.height) < 850);
const GODOT_CONFIG = {"args": [], "canvasResizePolicy": 2, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "experimentalVK": false, "fileSizes": {"index.pck": 27763484, "index.wasm": 39514754}, "focusCanvasOnStart": true, "mainPack": "index.pck", "serviceWorker": ""};
if (isMobileDevice) {
	GODOT_CONFIG.args = ["--device=mobile"];
} else {
	GODOT_CONFIG.args = ["--device=pc"];
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	
<script>
// Auto-detect mobile device & inject --device=mobile arg
(function() {
	const isMobileDevice = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
		|| (('ontouchstart' in window) && Math.min(window.screen.width, window.screen.height) < 850);

	if (typeof GODOT_CONFIG !== 'undefined') {
		if (isMobileDevice) {
			GODOT_CONFIG.args = ["--device=mobile"];
		} else {
			GODOT_CONFIG.args = ["--device=pc"];
		}
	}

	function tryLockLandscapeAndFullscreen() {
		if (isMobileDevice) {
			const el = document.documentElement;
			if (!document.fullscreenElement) {
				if (el.requestFullscreen) {
					el.requestFullscreen().catch(() => {});
				} else if (el.webkitRequestFullscreen) {
					el.webkitRequestFullscreen();
				}
			}
			if (screen.orientation && screen.orientation.lock) {
				screen.orientation.lock('landscape').catch(() => {});
			}
		}
	}
	document.addEventListener('touchstart', tryLockLandscapeAndFullscreen, { passive: true });
	document.addEventListener('click', tryLockLandscapeAndFullscreen, { passive: true });
})();
</script>

</body>
</html>
